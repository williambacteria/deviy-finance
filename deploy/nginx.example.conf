server {
    listen 80;
    server_name finance.example.com;
    root /srv/deviy-finance/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # 按 PHP-FPM 实际 socket 或 TCP 地址调整。
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~* \.(?:env|log|sql|sqlite|bak)$ {
        deny all;
    }
}
# 正式站点启用有效 HTTPS 证书，将 HTTP 重定向到 HTTPS。
# 宝塔部署保留面板生成的证书、PHP 与重写管理配置，根目录指向 public。
