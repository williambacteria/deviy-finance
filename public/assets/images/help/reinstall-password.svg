<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">重装系统、重置密码与状态查看</title>
  <desc id="desc">控制台中的重装系统、重置密码和实例状态操作，重装前需要备份。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#23436a" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="64" y="58" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#477aeb">SYSTEM &amp; SECURITY</text>
  <text x="64" y="106" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="31" font-weight="700" fill="#17345b">重装、改密与状态查看</text>
  <text x="64" y="137" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#7085a3">常用操作集中在服务详情页，执行前请确认影响范围并做好备份。</text>

  <g filter="url(#s)">
    <rect x="64" y="180" width="332" height="252" rx="15" fill="#fff" stroke="#e1eaf7"/>
    <rect x="88" y="204" width="42" height="42" rx="12" fill="#edf3ff"/><text x="109" y="232" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#477aeb">01</text>
    <text x="88" y="280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#17345b">重装系统</text>
    <text x="88" y="310" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#6e829f">选择镜像并确认后，实例会重启</text>
    <text x="88" y="331" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#6e829f">并清空系统盘。请先备份数据。</text>
    <rect x="88" y="360" width="272" height="46" rx="9" fill="#fff7ed" stroke="#f2dcbb"/>
    <text x="102" y="379" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#a66a16">不可逆操作</text>
    <text x="102" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#a66a16">系统盘数据将被清空</text>
  </g>

  <path d="M396 306h44" stroke="#b9cdf0" stroke-width="2" stroke-dasharray="5 5"/><path d="m434 299 8 7-8 7" fill="none" stroke="#7da6f2" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#s)">
    <rect x="452" y="180" width="332" height="252" rx="15" fill="#fff" stroke="#e1eaf7"/>
    <rect x="476" y="204" width="42" height="42" rx="12" fill="#edf3ff"/><text x="497" y="232" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#477aeb">02</text>
    <text x="476" y="280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#17345b">重置密码</text>
    <text x="476" y="310" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#6e829f">在远程连接区域修改管理员密码。</text>
    <text x="476" y="331" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#6e829f">修改后旧密码立即失效。</text>
    <rect x="476" y="360" width="284" height="46" rx="9" fill="#f5f9ff"/>
    <text x="490" y="379" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#315df4">建议使用强密码</text>
    <text x="490" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#647d9e">大小写 + 数字 + 符号，定期更换</text>
  </g>

  <path d="M796 306h44" stroke="#b9cdf0" stroke-width="2" stroke-dasharray="5 5"/><path d="m834 299 8 7-8 7" fill="none" stroke="#7da6f2" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#s)">
    <rect x="852" y="180" width="284" height="252" rx="15" fill="#173f75"/>
    <rect x="876" y="204" width="42" height="42" rx="12" fill="#2d588f"/><text x="897" y="232" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#cfe0ff">03</text>
    <text x="876" y="280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#fff">状态与监控</text>
    <text x="876" y="310" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b9d1ec">查看运行状态、CPU、内存和</text>
    <text x="876" y="331" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b9d1ec">带宽趋势，判断是否需升级。</text>
    <rect x="876" y="360" width="236" height="46" rx="9" fill="#204f89"/>
    <text x="890" y="379" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#dbeaff">资源监控</text>
    <text x="890" y="396" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#9fc2ee">独立页面 · 时间范围切换</text>
  </g>

  <rect x="64" y="456" width="1072" height="34" rx="8" fill="#fff" opacity=".7"/>
  <text x="88" y="478" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#647d9e">执行重装或改密前，请确认实例编号与操作对象，避免误操作生产实例。</text>
</svg>
