<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">备份与快照</title>
  <desc id="desc">从实例磁盘创建快照、异地保存并恢复。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#23436a" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6f96e8"/></marker>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="64" y="58" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#477aeb">BACKUP &amp; RESTORE</text>
  <text x="64" y="106" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="31" font-weight="700" fill="#17345b">备份不是可选项，而是底线</text>
  <text x="64" y="137" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#7085a3">快照能解决误操作和系统故障，但建议至少保留一份异地或独立介质备份。</text>

  <g filter="url(#s)">
    <rect x="64" y="180" width="338" height="224" rx="15" fill="#fff" stroke="#e1eaf7"/>
    <rect x="88" y="204" width="52" height="52" rx="13" fill="#edf3ff"/>
    <rect x="101" y="218" width="26" height="24" rx="4" fill="none" stroke="#477aeb" stroke-width="2"/>
    <path d="M107 226h14M107 233h9" stroke="#477aeb" stroke-width="2"/>
    <text x="88" y="294" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#17345b">实例数据</text>
    <text x="88" y="324" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#6e829f">网站文件、数据库、配置与</text>
    <text x="88" y="345" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#6e829f">业务运行所需的关键数据。</text>
    <text x="88" y="380" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#8da0ba">系统盘 / 数据盘</text>
  </g>

  <path d="M414 292h74" stroke="#6f96e8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="451" y="278" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#7189ab">创建快照</text>

  <g filter="url(#s)">
    <rect x="500" y="180" width="338" height="224" rx="15" fill="#173f75"/>
    <rect x="524" y="204" width="52" height="52" rx="13" fill="#2d588f"/>
    <circle cx="550" cy="230" r="13" fill="none" stroke="#cfe0ff" stroke-width="2"/><path d="M550 222v8l6 4" fill="none" stroke="#cfe0ff" stroke-width="2" stroke-linecap="round"/>
    <text x="524" y="294" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#fff">时间点快照</text>
    <text x="524" y="324" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b9d1ec">在变更前创建一个还原点，</text>
    <text x="524" y="345" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b9d1ec">保留当时的系统盘状态。</text>
    <text x="524" y="380" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#9fc2ee">建议命名：变更前-年月日</text>
  </g>

  <path d="M850 292h74" stroke="#6f96e8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="887" y="278" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#7189ab">恢复 / 迁移</text>

  <g filter="url(#s)">
    <rect x="936" y="180" width="200" height="224" rx="15" fill="#fff" stroke="#e1eaf7"/>
    <text x="960" y="216" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#17345b">应急恢复</text>
    <text x="960" y="250" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#405a7c">① 停止变更操作</text>
    <text x="960" y="278" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#405a7c">② 确认恢复点</text>
    <text x="960" y="306" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#405a7c">③ 执行恢复</text>
    <text x="960" y="334" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#405a7c">④ 验证业务</text>
    <rect x="960" y="360" width="140" height="26" rx="7" fill="#edf3ff"/>
    <text x="972" y="378" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="10" fill="#477aeb">恢复会覆盖当前状态</text>
  </g>

  <rect x="64" y="434" width="1072" height="34" rx="8" fill="#fff" opacity=".7"/>
  <text x="88" y="456" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#647d9e">重要数据请同时保留数据库导出、对象存储或本地备份；快照不等同于异地容灾。</text>
</svg>
